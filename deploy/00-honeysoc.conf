# HoneySOC — SSH hardening drop-in
# Placed in /etc/ssh/sshd_config.d/ as 00- so it is read BEFORE
# cloud-init's 50-cloud-init.conf (first match wins in sshd).
# Effect: move admin SSH off :22 (freeing it for the honeypot),
# and allow key-based auth only.

Port 22222
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
